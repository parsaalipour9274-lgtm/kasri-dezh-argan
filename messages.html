<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>پیام به اپراتور | کسری دژ ارجان</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7fa;
            color: #1e293b;
        }

        /* نوار بالا */

        header {
            background-color: #0f172a;
            color: white;
            padding: 20px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        nav a:hover {
            color: #f59e0b;
        }

        /* عنوان */

        .page-header {
            text-align: center;
            padding: 60px 20px 30px;
        }

        .page-header h1 {
            font-size: 38px;
            color: #0f172a;
        }

        .page-header p {
            color: #64748b;
            font-size: 17px;
        }

        /* فرم */

        .message-container {
            max-width: 700px;
            margin: 20px auto 80px;
            padding: 40px;
            background-color: white;
            border-radius: 18px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.08);
        }

        .message-container h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-family: inherit;

            font-size: 16px;

            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        .send-button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background-color: #2563eb;

            color: white;

            font-family: inherit;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;
        }

        .send-button:hover {
            background-color: #1d4ed8;
        }

        /* پیام آزمایشی */

        .notice {
            margin-top: 20px;
            padding: 15px;

            background-color: #eff6ff;

            color: #1e40af;

            border-radius: 8px;

            text-align: center;

            line-height: 1.8;
        }

        /* فوتر */

        footer {
            background-color: #0f172a;
            color: white;

            text-align: center;

            padding: 30px;
        }

        /* موبایل */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 6px;
                font-size: 13px;
            }

            .message-container {
                margin-left: 15px;
                margin-right: 15px;
                padding: 25px;
            }

            .page-header h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        کسری دژ ارجان
    </div>

    <nav>

        <a href="index.html">
            خانه
        </a>

        <a href="about.html">
            درباره ما
        </a>

        <a href="projects.html">
            پروژه‌ها
        </a>

        <a href="contact.html">
            تماس با ما
        </a>

        <a href="messages.html">
            پیام به اپراتور
        </a>

    </nav>

</header>


<section class="page-header">

    <h1>
        💬 پیام به اپراتور
    </h1>

    <p>
        سوال یا درخواست خود را برای ما ارسال کنید.
    </p>

</section>


<section class="message-container">

    <h2>
        ارسال پیام
    </h2>


    <form id="messageForm">

        <div class="form-group">

            <label for="name">
                نام و نام خانوادگی
            </label>

            <input
                type="text"
                id="name"
                placeholder="نام خود را وارد کنید"
                required>

        </div>


        <div class="form-group">

            <label for="phone">
                شماره تماس
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="مثلاً ۰۹۱۲..."
                required>

        </div>


        <div class="form-group">

            <label for="message">
                متن پیام
            </label>

            <textarea
                id="message"
                placeholder="پیام خود را بنویسید..."
                required></textarea>

        </div>


        <button
            type="submit"
            class="send-button">

            ارسال پیام

        </button>

    </form>


    <div class="notice">

        🔒 پیام‌های شما محرمانه تلقی می‌شوند.

    </div>

</section>


<footer>

    <p>
        © ۱۴۰۵ شرکت کسری دژ ارجان
    </p>

</footer>


<script>

    document
        .getElementById("messageForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            alert(
                "فرم آماده است، اما برای ارسال واقعی پیام باید سیستم سرور و پایگاه داده را وصل کنیم."
            );

        });

</script>


</body>

</html>
